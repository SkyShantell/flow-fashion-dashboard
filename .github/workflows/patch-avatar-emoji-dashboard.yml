name: Patch Avatar Emoji Dashboard

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-avatar-emoji-dashboard.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch dashboard
        run: |
          python .github/scripts/patch_avatar_emoji_dashboard.py
          git diff --check
      - name: Build dashboard
        run: |
          npm ci
          npm run build
      - name: Commit dashboard patch
        run: |
          git config user.name "SkyShantell"
          git config user.email "168357390+SkyShantell@users.noreply.github.com"
          git add app
          if git diff --cached --quiet; then
            echo "No dashboard changes"
          else
            git commit -m "Use external avatars and shared Apple emoji cache"
            git push origin main
          fi
