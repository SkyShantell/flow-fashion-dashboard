name: Add Hide Batches UI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-hide-batches.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Add hide and restore controls for batches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('app/page.tsx')
          text = page.read_text()

          old = '  const [batches, setBatches] = useState<Batch[]>([]);\n  const [selectedId, setSelectedId] = useState<string>("");'
          new = '  const [batches, setBatches] = useState<Batch[]>([]);\n  const [hiddenBatchIds, setHiddenBatchIds] = useState<string[]>([]);\n  const [hiddenBatchesLoaded, setHiddenBatchesLoaded] = useState(false);\n  const [showHiddenBatches, setShowHiddenBatches] = useState(false);\n  const [selectedId, setSelectedId] = useState<string>("");'
          if text.count(old) != 1:
              raise SystemExit('Could not locate batch state block')
          text = text.replace(old, new, 1)

          marker = '  }, [scanner]);\n\n  useEffect(() => { void loadHealth(); void loadFlowAccounts(); void loadBatches(); void loadScanner(); void loadAvatars(); }, [loadHealth, loadFlowAccounts, loadBatches, loadScanner, loadAvatars]);'
          insert = '''  }, [scanner]);

  const hiddenBatchSet = useMemo(() => new Set(hiddenBatchIds), [hiddenBatchIds]);
  const visibleBatches = useMemo(() => batches.filter(b => !hiddenBatchSet.has(b.id)), [batches, hiddenBatchSet]);
  const hiddenBatches = useMemo(() => batches.filter(b => hiddenBatchSet.has(b.id)), [batches, hiddenBatchSet]);

  useEffect(() => {
    try {
      const saved = localStorage.getItem("flow-fashion-hidden-batches");
      if (saved) {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed)) setHiddenBatchIds(parsed.filter((x): x is string => typeof x === "string"));
      }
    } catch {}
    setHiddenBatchesLoaded(true);
  }, []);
  useEffect(() => {
    if (!hiddenBatchesLoaded) return;
    try { localStorage.setItem("flow-fashion-hidden-batches", JSON.stringify(hiddenBatchIds)); } catch {}
  }, [hiddenBatchIds, hiddenBatchesLoaded]);
  useEffect(() => {
    if (!hiddenBatchesLoaded || !selectedId || !hiddenBatchSet.has(selectedId)) return;
    const next = batches.find(b => !hiddenBatchSet.has(b.id));
    setSelectedId(next?.id || "");
  }, [batches, hiddenBatchSet, hiddenBatchesLoaded, selectedId]);

  useEffect(() => { void loadHealth(); void loadFlowAccounts(); void loadBatches(); void loadScanner(); void loadAvatars(); }, [loadHealth, loadFlowAccounts, loadBatches, loadScanner, loadAvatars]);'''
          if text.count(marker) != 1:
              raise SystemExit('Could not locate memo/effect insertion point')
          text = text.replace(marker, insert, 1)

          marker2 = '  function flash(msg: string) { setMessage(msg); setError(""); setTimeout(() => setMessage(""), 3500); }\n'
          insert2 = '''  function flash(msg: string) { setMessage(msg); setError(""); setTimeout(() => setMessage(""), 3500); }
  function hideBatch(batchId: string) {
    setHiddenBatchIds(prev => prev.includes(batchId) ? prev : [...prev, batchId]);
    if (selectedId === batchId) {
      const next = batches.find(b => b.id !== batchId && !hiddenBatchSet.has(b.id));
      setSelectedId(next?.id || "");
    }
  }
  function restoreBatch(batchId: string) {
    setHiddenBatchIds(prev => prev.filter(id => id !== batchId));
  }
'''
          if text.count(marker2) != 1:
              raise SystemExit('Could not locate flash helper')
          text = text.replace(marker2, insert2, 1)

          old_sidebar = '''        <div className="sideLabel">Batches</div>
        <div className="batchList">
          {batches.map(b => <button key={b.id} className={`batchBtn ${selectedId === b.id ? "active" : ""}`} onClick={() => setSelectedId(b.id)}><b>{b.name || "Untitled batch"}</b><span>{b.mode === "shoe_showcase" ? "Shoe Showcase" : (b.avatar_name ? `Fashion Try-On · ${b.avatar_name}` : "Fashion Try-On")} · {Number(b.counts?.products || 0)} products · {b.status}</span></button>)}
          {!batches.length && <div className="muted">No batches yet.</div>}
        </div>'''
          new_sidebar = '''        <div className="sideLabel sideLabelRow">
          <span>Batches</span>
          {hiddenBatches.length > 0 && <button className="hiddenBatchToggle" onClick={() => setShowHiddenBatches(v => !v)}>{showHiddenBatches ? "Done" : `Hidden (${hiddenBatches.length})`}</button>}
        </div>
        <div className="batchList">
          {visibleBatches.map(b => <div key={b.id} className="batchRow">
            <button className={`batchBtn ${selectedId === b.id ? "active" : ""}`} onClick={() => setSelectedId(b.id)}><b>{b.name || "Untitled batch"}</b><span>{b.mode === "shoe_showcase" ? "Shoe Showcase" : (b.avatar_name ? `Fashion Try-On · ${b.avatar_name}` : "Fashion Try-On")} · {Number(b.counts?.products || 0)} products · {b.status}</span></button>
            <button className="batchHideBtn" onClick={() => hideBatch(b.id)} title="Hide batch" aria-label={`Hide ${b.name || "batch"}`}>Hide</button>
          </div>)}
          {!visibleBatches.length && batches.length > 0 && <div className="muted">All batches are hidden.</div>}
          {!batches.length && <div className="muted">No batches yet.</div>}
          {showHiddenBatches && hiddenBatches.length > 0 && <div className="hiddenBatchList">
            {hiddenBatches.map(b => <div key={b.id} className="hiddenBatchRow"><span title={b.name || "Untitled batch"}>{b.name || "Untitled batch"}</span><button onClick={() => restoreBatch(b.id)}>Restore</button></div>)}
          </div>}
        </div>'''
          if text.count(old_sidebar) != 1:
              raise SystemExit('Could not locate sidebar batch list')
          text = text.replace(old_sidebar, new_sidebar, 1)
          page.write_text(text)

          css = Path('app/globals.css')
          c = css.read_text()
          addition = '''

/* Hide/restore batch controls */
.sideLabelRow{display:flex;align-items:center;justify-content:space-between;gap:8px}.sideLabelRow>span{display:block}.hiddenBatchToggle{border:0;background:transparent;color:#8190a8;font-size:10px;font-weight:800;letter-spacing:0;text-transform:none;cursor:pointer;padding:2px 0}.hiddenBatchToggle:hover{color:#d8e2f2}.batchRow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px;align-items:stretch}.batchRow .batchBtn{min-width:0;width:100%}.batchHideBtn{align-self:center;border:1px solid transparent;background:transparent;color:#66748a;border-radius:8px;padding:7px 6px;font-size:9px;font-weight:800;cursor:pointer;opacity:0;transition:.15s}.batchRow:hover .batchHideBtn,.batchHideBtn:focus-visible{opacity:1}.batchHideBtn:hover{color:#dbe4f2;background:#141b27;border-color:#293448}.hiddenBatchList{margin-top:6px;padding-top:7px;border-top:1px solid #1d2634;display:flex;flex-direction:column;gap:5px}.hiddenBatchRow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;padding:6px 7px;border-radius:9px;background:#0b1018}.hiddenBatchRow span{font-size:10px;color:#7f8ca0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hiddenBatchRow button{border:0;background:transparent;color:#9eb4d2;font-size:9px;font-weight:800;cursor:pointer;padding:4px}.hiddenBatchRow button:hover{color:white}
'''
          if '/* Hide/restore batch controls */' not in c:
              css.write_text(c + addition)
          PY

      - name: Build check
        run: npm ci && npm run build

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/globals.css
          git commit -m "Add hide and restore controls for batches"
          git push origin HEAD:main
