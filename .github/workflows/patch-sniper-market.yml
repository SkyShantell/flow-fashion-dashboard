name: Patch Momentum Sniper Shop Market

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-sniper-market.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Add per-run US UK selector to Momentum Sniper Queue
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/page.tsx")
          text = path.read_text()

          def rep(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match, found {count}: {old[:180]!r}")
              text = text.replace(old, new, 1)

          rep(
              '  const [sniperDestinationByRun, setSniperDestinationByRun] = useState<Record<string, string>>({});\n  const [loading, setLoading]',
              '  const [sniperDestinationByRun, setSniperDestinationByRun] = useState<Record<string, string>>({});\n  const [sniperMarketByRun, setSniperMarketByRun] = useState<Record<string, "US" | "UK">>({});\n  const [loading, setLoading]'
          )

          rep(
              '    const creatorProfile = sniperProfileByRun[runId] || "Male";\n    const openAvatarBatches =',
              '    const creatorProfile = sniperProfileByRun[runId] || "Male";\n    const market = sniperMarketByRun[runId] || "US";\n    const openAvatarBatches ='
          )

          rep(
              '        body: JSON.stringify({ row_nums: rowNums, start_generation: false }),',
              '        body: JSON.stringify({ row_nums: rowNums, start_generation: false, region: market === "UK" ? "GB" : "US" }),'
          )

          rep(
              '                    const destination = sniperDestinationByRun[group.id] || (openAvatarBatches[0]?.id || "new");\n\n                    return <div',
              '                    const destination = sniperDestinationByRun[group.id] || (openAvatarBatches[0]?.id || "new");\n                    const market = sniperMarketByRun[group.id] || "US";\n\n                    return <div'
          )

          rep(
              '                        <label>Destination\n                          <select disabled={!avatar} value={destination}',
              '                        <label>TikTok Shop market\n                          <select value={market} onChange={e => setSniperMarketByRun(prev => ({ ...prev, [group.id]: e.target.value as "US" | "UK" }))}>\n                            <option value="US">US</option>\n                            <option value="UK">UK</option>\n                          </select>\n                          <span className="fieldHint">UK uses SociaVault region GB.</span>\n                        </label>\n\n                        <label>Destination\n                          <select disabled={!avatar} value={destination}'
          )

          path.write_text(text)
          PY

      - name: Build check
        run: npm ci && npm run build

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "Add US UK selector to Momentum Sniper Queue"
          git push origin HEAD:main
