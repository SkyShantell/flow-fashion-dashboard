name: Patch TikHub Labels

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-tikhub-labels.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update UK provider labels
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("app/page.tsx")
          text = path.read_text()
          old = "UK uses SociaVault region GB."
          new = "UK uses TikHub region GB. US uses SociaVault."
          count = text.count(old)
          if count < 1:
              raise SystemExit("Old UK provider label not found")
          path.write_text(text.replace(old, new))
          PY
      - name: Build check
        run: npm ci && npm run build
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "Label TikHub as UK Shop provider"
          git push origin HEAD:main
